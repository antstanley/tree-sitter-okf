[package]
name = "tree-sitter-okf"
description = "Open Knowledge Format (OKF) grammar for tree-sitter: markdown concept documents with YAML frontmatter"
version = "0.1.0"
authors = ["tree-sitter-okf contributors"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "okf"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/antstanley/tree-sitter-okf"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
