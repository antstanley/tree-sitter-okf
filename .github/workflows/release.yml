name: Release

# Tag-driven release with trusted publishing (OIDC) to every registry. No
# registry token exists anywhere: each publish job exchanges this workflow's
# GitHub OIDC token for a short-lived credential.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# 1. validate:  the tag matches the version in every manifest
# 2. ci:        the full CI workflow (tests, every binding) on the tagged commit
# 3. build-*:   the npm tarball, the Python sdist and abi3 wheels, built in
#               jobs that cannot publish (CI already packages the crate)
# 4. publish-*: npm (STAGED: not live until approved), crates.io, PyPI; each
#               skips a version that is already published, so a re-run only
#               publishes what is missing
# 5. create-release: a GitHub Release with the CHANGELOG entry
#
# Go and Swift consumers resolve the git tag itself; nothing to publish.
# One-time registry setup is in docs/releasing.md.
on:
  push:
    tags:
      - "v*.*.*"
  # Dry run: validate, CI and every build, without publishing. Use it to
  # check the release path (wheels on every platform) before tagging.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Tag matches every manifest
        id: extract
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node script/check-versions.js "$REF_NAME"
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            node script/check-versions.js
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  build-npm:
    name: Build npm tarball
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      # The package ships sources (src/parser.c, src/scanner.c) and compiles
      # on install through node-gyp-build; nothing to build first.
      - run: mkdir -p dist && npm pack --pack-destination dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm
          path: dist/*.tgz
          if-no-files-found: error

  build-sdist:
    name: Build Python sdist
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist --outdir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Build Python wheels (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # abi3 (cp310+): one wheel per platform covers every CPython >= 3.10
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          # macOS runners are arm64; build the Intel wheel alongside it
          CIBW_ARCHS_MACOS: x86_64 arm64
        with:
          output-dir: dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  publish-npm:
    name: Stage to npm
    needs: [validate, ci, build-npm]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: publish
    # Only the publish jobs may mint OIDC tokens, so registry credentials
    # never meet build or test code.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for trusted publishing and `npm stage`
        # trusted publishing needs npm >= 11.5.1; `npm stage` is newer still
        run: npm install -g npm@latest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm
          path: dist
      # Publishes are STAGED: npm holds the upload until a maintainer approves
      # it with 2FA (`npm stage approve <id>` or the npmjs staged-packages UI),
      # so the trusted publisher can be restricted to stage-publish only.
      - name: Stage tree-sitter-okf
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/staged.log"
          if npm view "tree-sitter-okf@${VERSION}" version >/dev/null 2>&1; then
            echo "tree-sitter-okf@${VERSION} already published; skipping"
            exit 0
          fi
          # --ignore-scripts: the tarball is uploaded, not installed. The
          # "(staged with id ...)" line is teed for the summary below; 2>&1
          # because npm prints notices on stderr.
          npm stage publish --provenance --access public --ignore-scripts \
            "dist/tree-sitter-okf-${VERSION}.tgz" 2>&1 | tee -a "${RUNNER_TEMP}/staged.log"
      # The staging id comes from the publish output: `npm stage list` would
      # need an account token, which this workflow deliberately does not have.
      - name: Summarize (approve to go live)
        run: |
          set -euo pipefail
          {
            echo "## npm"
            echo
            if grep -q 'staged with id' "${RUNNER_TEMP}/staged.log"; then
              grep 'staged with id' "${RUNNER_TEMP}/staged.log" | sed 's/^+ /- /'
              echo
              echo 'Not live yet. Approve with `npm stage approve <id>` or the npmjs staged-packages UI.'
            else
              echo 'Nothing staged: this version is already published.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  publish-crates:
    name: Publish to crates.io
    needs: [validate, ci]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Check whether this version is already on crates.io
        id: exists
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "tree-sitter-okf release (github.com/antstanley/tree-sitter-okf)" \
            "https://crates.io/api/v1/crates/tree-sitter-okf/${VERSION}")
          if [ "$status" = "200" ]; then
            echo "tree-sitter-okf ${VERSION} already on crates.io; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.exists.outputs.published == 'false'
        id: auth
      - name: cargo publish
        if: steps.exists.outputs.published == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-pypi:
    name: Publish to PyPI
    needs: [validate, ci, build-sdist, build-wheels]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  create-release:
    name: Create GitHub Release
    needs: [validate, publish-npm, publish-crates, publish-pypi]
    # Run unless something FAILED (a fully-published re-run still gets its release).
    if: ${{ github.ref_type == 'tag' && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Changelog entry
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        # The changesets-written section for this version; raw git log when
        # there is none (a hand-tagged hotfix).
        run: |
          set -euo pipefail
          awk -v ver="## ${VERSION}" '$0 == ver {found=1; next} /^## / {found=0} found' CHANGELOG.md > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
            git log --pretty=format:"- %s (%h)" ${PREV_TAG:+"$PREV_TAG"..HEAD} > notes.md
          fi
          {
            echo
            echo "## Install"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| npm | \`npm install tree-sitter-okf@${VERSION}\` (staged: live once approved) |"
            echo "| crates.io | \`cargo add tree-sitter-okf@${VERSION}\` |"
            echo "| PyPI | \`pip install tree-sitter-okf==${VERSION}\` |"
            echo "| Go | \`go get github.com/antstanley/tree-sitter-okf@v${VERSION}\` |"
            echo "| Swift | \`.package(url: \"https://github.com/antstanley/tree-sitter-okf\", from: \"${VERSION}\")\` |"
          } >> notes.md
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }}
          body_path: notes.md
          draft: false
          prerelease: false
