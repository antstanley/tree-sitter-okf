# Continuous integration (spec §10.3): generate reproducibility, the corpus,
# node-type docs, vendor locks, differential, query, helper and property
# suites (script/test), every binding, and a coarse benchmark gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the same checks before anything is published
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tree-sitter>=0.25,<0.27" "tree-sitter-yaml>=0.7" "PyYAML>=6" setuptools wheel
          python -m pip install -e .
      - name: script/test
        env:
          PYTHON: python
        run: script/test
      - name: Benchmark (coarse gate)
        env:
          PYTHON: python
        # The baseline was recorded on a developer machine; CI runners differ,
        # so only order-of-magnitude regressions and non-linear scaling fail.
        run: python script/bench --tolerance 10

  rust:
    name: Rust binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: cargo test
      # what `cargo publish` would upload builds on its own
      - run: cargo package

  go:
    name: Go binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # vendor/ holds the pinned tree-sitter-markdown sources, not Go modules
      - run: go mod tidy
      - run: go test -mod=mod ./...

  swift:
    name: Swift binding
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: swift test

  c:
    name: C library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # a fresh checkout's mtimes can make src/parser.c look older than
      # src/grammar.json, which would ask for the tree-sitter CLI
      - run: touch src/parser.c
      - run: make
      - run: cmake -S . -B build/cmake && cmake --build build/cmake

  dialects:
    name: Experimental dialects generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate with wikilink and tag dialects
        env:
          OKF_DIALECT_WIKILINK: "1"
          OKF_DIALECT_TAGS: "1"
        run: npx tree-sitter generate --abi 14 && npx tree-sitter build
